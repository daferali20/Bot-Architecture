[project]
name = "trading-bot"
version = "1.0.0"
description = "AI Trading Bot with Local Engine"
requires-python = ">=3.11,<3.14"
dependencies = [
    "streamlit>=1.31.0",
    "ib-insync>=0.9.86",
    "pandas>=2.2.0",
    "plotly>=5.18.0",
    "openai>=1.12.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "python-dotenv>=1.0.0",
    "ta>=0.11.0",
]

[build-system]
requires = ["setuptools>=69.0.0", "wheel>=0.42.0"]
build-backend = "setuptools.build_meta"
